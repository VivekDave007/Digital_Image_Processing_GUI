<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIP Engine Dashboard</title>
    <!-- Futuristic Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-base: #090a0f;
            --bg-surface: #12141d;
            --bg-panel: #1a1d27;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff003c;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --text-main: #e0e0e0;
            --text-muted: #8a8d98;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.5), inset 0 0 5px rgba(0, 243, 255, 0.2);
        }

        /* --- RESET & BASIC SETUP --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Rigid 100vh app */
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-base);
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- THE 3-PANE GRID LAYOUT --- */
        .dashboard-container {
            display: grid;
            grid-template-columns: 25% 50% 25%;
            height: 100vh;
            width: 100vw;
        }

        /* Common Pane Styles */
        .pane {
            height: 100%;
            overflow-y: auto;
            padding: 1.5rem;
            border-right: 1px solid rgba(0, 243, 255, 0.1);
        }

        .pane:last-child {
            border-right: none;
        }

        /* --- SPECIFIC PANES --- */
        /* Left: Controls */
        .pane-controls {
            background-color: var(--bg-surface);
            box-shadow: 5px 0 20px rgba(0, 243, 255, 0.05);
            z-index: 10;
        }

        /* Center: Viewport */
        .pane-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Right: Telemetry */
        .pane-telemetry {
            background-color: var(--bg-surface);
            border-left: 1px solid rgba(255, 0, 60, 0.2);
            box-shadow: -5px 0 20px rgba(255, 0, 60, 0.05);
            z-index: 10;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            color: transparent;
            background: -webkit-linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        h2 {
            color: var(--neon-pink);
            text-transform: uppercase;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--neon-pink);
            padding-bottom: 5px;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
        }

        .mono-text {
            font-family: 'Fira Code', monospace;
        }

        /* --- FORMS & INPUTS --- */
        .control-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: var(--neon-pink);
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* --- BUTTONS --- */
        button.cyber-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 0.75rem 1.5rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: var(--border-glow);
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1rem;
        }

        button.cyber-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* --- IMAGES & VIEWER --- */
        .viewer-card {
            background-color: var(--bg-panel);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 1rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .viewer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 2px;
            background: var(--neon-cyan);
        }

        .viewer-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 2px;
            background: var(--neon-cyan);
        }

        img.render-canvas {
            max-width: 100%;
            border-radius: 4px;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.2);
        }

        /* --- TELEMETRY WIDGETS --- */
        .telemetry-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .metric-value {
            color: var(--neon-cyan);
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-pink);
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--neon-pink);
            z-index: 20;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border: 1px solid var(--neon-pink);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- INLINE REACT CODE -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook for Window Resize (Canvas Resizing)
        function useWindowSize() {
            const [size, setSize] = useState([0, 0]);
            useEffect(() => {
                function updateSize() { setSize([window.innerWidth, window.innerHeight]); }
                window.addEventListener('resize', updateSize);
                updateSize();
                return () => window.removeEventListener('resize', updateSize);
            }, []);
            return size;
        }

        // --- MODULE COMPONENTS ---

        function VisualPerception({ processImage, loading }) {
            const [illumination, setIllumination] = useState(0.5);
            const [machBands, setMachBands] = useState(false);

            useEffect(() => {
                const formData = new FormData();
                formData.append('illumination', illumination);
                formData.append('mach_bands', machBands);
                processImage('http://localhost:8000/api/perception/simulate', formData);
            }, [illumination, machBands]);

            return (
                <>
                    <h2>Perception Parameters</h2>
                    <div className="control-group">
                        <label>Illumination Level: <span className="mono-text">{illumination}</span></label>
                        <input
                            type="range" min="0" max="1" step="0.01" value={illumination}
                            onChange={(e) => setIllumination(parseFloat(e.target.value))}
                        />
                    </div>
                    <div className="control-group" style={{ marginTop: '2rem' }}>
                        <label style={{ display: 'flex', alignItems: 'center', cursor: 'pointer' }}>
                            <input
                                type="checkbox" checked={machBands}
                                onChange={(e) => setMachBands(e.target.checked)}
                                style={{ marginRight: '10px', width: '20px', height: '20px' }}
                            />
                            Enable Mach Band Effect
                        </label>
                    </div>
                </>
            );
        }

        function ImageStatistics({ processImage, loading }) {
            const [mode, setMode] = useState("basic");
            const [noiseParam1, setNoiseParam1] = useState(0.0);
            const [noiseParam2, setNoiseParam2] = useState(25.0);

            useEffect(() => {
                const formData = new FormData();
                formData.append('mode', mode);
                formData.append('noise_param_1', noiseParam1);
                formData.append('noise_param_2', noiseParam2);
                processImage('http://localhost:8000/api/stats/process', formData);
            }, [mode, noiseParam1, noiseParam2]);

            return (
                <>
                    <h2>Statistics & Operations</h2>
                    <div className="control-group">
                        <label>Operation Mode</label>
                        <select
                            className="cyber-btn"
                            style={{ background: 'var(--bg-panel)', color: 'var(--text-main)', width: '100%', marginBottom: '1rem', padding: '0.5rem' }}
                            value={mode}
                            onChange={(e) => setMode(e.target.value)}
                        >
                            <option value="basic">Basic Analysis</option>
                            <option value="contrast">Contrast Stretching</option>
                            <option value="noise_gaussian">Add Gaussian Noise</option>
                            <option value="noise_sp">Add Salt & Pepper Noise</option>
                        </select>
                    </div>

                    {mode === "noise_gaussian" && (
                        <>
                            <div className="control-group">
                                <label>Gaussian Mean (μ): <span className="mono-text">{noiseParam1}</span></label>
                                <input type="range" min="-50" max="50" step="1" value={noiseParam1} onChange={(e) => setNoiseParam1(parseFloat(e.target.value))} />
                            </div>
                            <div className="control-group">
                                <label>Gaussian Sigma (σ): <span className="mono-text">{noiseParam2}</span></label>
                                <input type="range" min="0" max="100" step="1" value={noiseParam2} onChange={(e) => setNoiseParam2(parseFloat(e.target.value))} />
                            </div>
                        </>
                    )}

                    {mode === "noise_sp" && (
                        <div className="control-group">
                            <label>Noise Probability (p): <span className="mono-text">{noiseParam1}</span></label>
                            <input type="range" min="0" max="0.5" step="0.01" value={noiseParam1} onChange={(e) => setNoiseParam1(parseFloat(e.target.value))} />
                        </div>
                    )}
                </>
            );
        }


        // --- MAIN APP COMPONENT ---
        function App() {
            const [activeModule, setActiveModule] = useState('1.1');
            const [loading, setLoading] = useState(false);
            const [telemetry, setTelemetry] = useState({});
            const [imageOriginal, setImageOriginal] = useState(null);
            const [imageResult, setImageResult] = useState(null);

            // Fetch Handler stored in root
            const handleProcess = async (url, formData) => {
                setLoading(true);
                try {
                    const response = await fetch(url, { method: 'POST', body: formData });
                    if (response.ok) {
                        const data = await response.json();
                        setImageResult(data.image);
                        if (data.image_original) setImageOriginal(data.image_original);
                        setTelemetry(data.telemetry || {});
                    } else {
                        console.error("Backend Error:", response.status);
                    }
                } catch (error) {
                    console.error("Network Error:", error);
                }
                setLoading(false);
            };

            // Helper to render histograms
            const renderHistogram = (histData) => {
                if (!histData || histData.length === 0) return null;
                const maxVal = Math.max(...histData);
                if (maxVal === 0) return null;

                return (
                    <div style={{ display: 'flex', alignItems: 'flex-end', height: '100px', width: '100%', gap: '1px', borderBottom: '1px solid var(--neon-cyan)', marginTop: '1rem' }}>
                        {histData.map((val, idx) => (
                            <div key={idx} style={{
                                height: `${(val / maxVal) * 100}%`,
                                width: '100%',
                                backgroundColor: 'var(--neon-cyan)',
                                opacity: 0.8
                            }} title={`Val: ${idx}, Count: ${val}`} />
                        ))}
                    </div>
                );
            };

            return (
                <div className="dashboard-container">
                    {/* LEFT PANE: CONTROLS */}
                    <div className="pane pane-controls">
                        <h1>DIP Engine</h1>

                        <h2>System Initialization</h2>
                        <div className="control-group">
                            <label>Module Selection</label>
                            <select
                                className="cyber-btn"
                                style={{ background: 'var(--bg-panel)', color: 'var(--neon-pink)', width: '100%', marginBottom: '2rem', borderColor: 'var(--neon-pink)', boxShadow: '0 0 10px rgba(255,0,60,0.3)' }}
                                value={activeModule}
                                onChange={(e) => {
                                    setActiveModule(e.target.value);
                                    setImageResult(null); setImageOriginal(null); setTelemetry({});
                                }}
                            >
                                <option value="1.1">1.1 Visual Perception</option>
                                <option value="1.9">1.9 Image Statistics</option>
                                <option disabled>Other modules pending link...</option>
                            </select>
                        </div>

                        {/* Dynamic Module Controls based on Switch */}
                        {activeModule === '1.1' ? (
                            <VisualPerception processImage={handleProcess} loading={loading} />
                        ) : activeModule === '1.9' ? (
                            <ImageStatistics processImage={handleProcess} loading={loading} />
                        ) : null}

                        <div style={{ marginTop: 'auto', paddingTop: '4rem', opacity: 0.5, fontSize: '0.8rem', textAlign: 'center' }}>
                            SYSTEM BUILD: v2.0.4 | STATUS: NOMINAL
                        </div>
                    </div>

                    {/* CENTER PANE: VIEWPORT */}
                    <div className="pane pane-viewport">
                        <div className="viewer-card" style={{ marginTop: '2rem', flexGrow: 1, justifyContent: 'center' }}>
                            <h2 style={{ alignSelf: 'flex-start', borderBottom: 'none' }}>Viewport Alpha</h2>

                            {loading && <div className="loading-overlay">UPLOADING SIGNAL...</div>}

                            <div style={{ display: 'flex', gap: '2rem', justifyContent: 'center', alignItems: 'center', width: '100%' }}>
                                {imageOriginal && (
                                    <div style={{ textAlign: 'center' }}>
                                        <div style={{ color: 'var(--text-muted)', marginBottom: '0.5rem' }}>Source Signal</div>
                                        <img src={imageOriginal} className="render-canvas" style={{ maxHeight: '400px', opacity: 0.7 }} />
                                    </div>
                                )}

                                {imageResult ? (
                                    <div style={{ textAlign: 'center' }}>
                                        <div style={{ color: 'var(--neon-cyan)', marginBottom: '0.5rem', textShadow: '0 0 5px var(--neon-cyan)' }}>Processed Output</div>
                                        <img src={imageResult} className="render-canvas" style={{ maxHeight: '500px' }} />
                                    </div>
                                ) : (
                                    !loading && <div style={{ color: 'var(--neon-cyan)', margin: 'auto', fontFamily: 'Fira Code', textShadow: '0 0 10px var(--neon-cyan)' }}>
                                        [ NO SIGNAL RECEIVED ]
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* RIGHT PANE: TELEMETRY & STATS */}
                    <div className="pane pane-telemetry">
                        <h2>System Telemetry</h2>

                        <div className="telemetry-card">
                            <label>Render Status</label>
                            <div className="metric-value mono-text" style={{ color: loading ? 'var(--neon-pink)' : 'var(--neon-green)' }}>
                                {loading ? "COMPUTING" : "ONLINE"}
                            </div>
                        </div>

                        {/* Dynamic Telemetry Display */}
                        {activeModule === '1.1' && telemetry.vision_mode && (
                            <>
                                <div className="telemetry-card">
                                    <label>Vision Paradigm</label>
                                    <div className="metric-value">{telemetry.vision_mode}</div>
                                </div>
                                <div className="telemetry-card">
                                    <label>Rod Activation</label>
                                    <div className="metric-value mono-text" style={{ color: telemetry.scotopic_active ? 'var(--neon-cyan)' : 'var(--text-muted)' }}>
                                        {telemetry.scotopic_active ? "HIGH" : "LOW"}
                                    </div>
                                </div>
                                <div className="telemetry-card">
                                    <label>Bg Intensity</label>
                                    <div className="metric-value mono-text">{telemetry.background_intensity || 0}</div>
                                </div>
                            </>
                        )}

                        {activeModule === '1.1' && telemetry.mode === "Mach Band Demonstration" && (
                            <>
                                <div className="telemetry-card">
                                    <label>Perception Mode</label>
                                    <div className="metric-value">Mach Bands</div>
                                </div>
                                <div className="telemetry-card">
                                    <label>Intensity Steps</label>
                                    <div className="metric-value mono-text">{telemetry.steps}</div>
                                </div>
                            </>
                        )}

                        {activeModule === '1.9' && telemetry.stats && (
                            <>
                                <div className="telemetry-card" style={{ borderLeft: '4px solid var(--neon-purple)' }}>
                                    <label>Applied Operation</label>
                                    <div className="metric-value" style={{ fontSize: '1.2rem' }}>{telemetry.action}</div>
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                                    <div className="telemetry-card" style={{ marginBottom: 0 }}>
                                        <label>Mean (μ)</label>
                                        <div className="metric-value mono-text" style={{ fontSize: '1.4rem' }}>{telemetry.stats.mean}</div>
                                    </div>
                                    <div className="telemetry-card" style={{ marginBottom: 0 }}>
                                        <label>Std Dev (σ)</label>
                                        <div className="metric-value mono-text" style={{ fontSize: '1.4rem' }}>{telemetry.stats.std_dev}</div>
                                    </div>
                                    <div className="telemetry-card" style={{ marginBottom: 0 }}>
                                        <label>Variance</label>
                                        <div className="metric-value mono-text" style={{ fontSize: '1.4rem' }}>{telemetry.stats.variance}</div>
                                    </div>
                                    <div className="telemetry-card" style={{ marginBottom: 0 }}>
                                        <label>Min / Max</label>
                                        <div className="metric-value mono-text" style={{ fontSize: '1.4rem' }}>{telemetry.stats.min} / {telemetry.stats.max}</div>
                                    </div>
                                </div>

                                <div className="telemetry-card" style={{ marginTop: '1rem', background: 'var(--bg-base)' }}>
                                    <label>Intensity Histogram Profile</label>
                                    {renderHistogram(telemetry.stats.histogram)}
                                </div>
                            </>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
